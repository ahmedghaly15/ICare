name: icare
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  cloud_firestore: ^4.15.5
  firebase_auth: ^4.17.5
  firebase_core: ^2.25.4
  # A declarative routing solution for navigation
  auto_route: ^7.8.4
  # Code generator (mainly used with Cubit & retrofit)
  freezed: ^2.4.6
  freezed_annotation: ^2.4.1
  # Automatically generate code for converting to and from JSON by annotating Dart classes.
  json_serializable: ^6.7.1
  json_annotation: ^4.8.1
  # Simple direct Service Locator that allows to access the concrete implementation from everywhere
  get_it: ^7.6.4
  # State management
  flutter_bloc: ^8.1.3
  # Networking
  dio: ^5.3.4
  retrofit: ^4.0.3
  retrofit_generator: ^8.0.6
  pretty_dio_logger: ^1.3.1
  # An SVG rendering and widget library for Flutter, which allows painting
  flutter_svg: ^2.0.9
  # Flutter plugin for reading and writing simple key-value pairs for cache
  shared_preferences: ^2.2.2
  # For validating email addresses
  email_validator: ^2.1.17
  # Dart library that checks for internet
  internet_connection_checker: ^1.0.0+1
  # A flutter plugin for adapting screen and font size.Guaranteed to look good on different models
  flutter_screenutil: ^5.9.0
  # Updating app's launcher icon.
  flutter_launcher_icons: ^0.13.1
  # Animations built with the Rive editor
  rive: ^0.12.3
  # Animated loading indicators
  flutter_spinkit: ^5.2.0
  # (OTP) text field
  pinput: ^3.0.1
  # Approximate how Flutter app looks and performs on another device.
  device_preview: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Automatically generate navigation
  auto_route_generator:
  # A build system for Dart code generation and modular compilation.
  build_runner: ^2.4.8
  # Recommended lints to encourage good coding practices
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/rive/

  fonts:
    - family: inter
      fonts:
        - asset: assets/fonts/inter/inter-Light.ttf
          weight: 300
        - asset: assets/fonts/inter/inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/inter-Bold.ttf
          weight: 700

flutter_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"

flutter_assets:
  assets_path: assets/
  output_path: lib/src/core/utils/
  filename: app_assets.dart
  field_prefix: null
