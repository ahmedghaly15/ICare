name: icare
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # A declarative routing solution for navigation
  auto_route: ^7.8.4
  # Implement value based equality
  equatable: ^2.0.5
  # Simple direct Service Locator that allows to access the concrete implementation from everywhere
  get_it: ^7.6.4
  # State management
  flutter_bloc: ^8.1.3
  # HTTP networking package
  dio: ^5.3.4
  # Easily create toast messages
  fluttertoast: ^8.2.4
  # Flutter plugin for reading and writing simple key-value pairs for cache
  shared_preferences: ^2.2.2
  # For validating email addresses
  email_validator: ^2.1.17
  # Dart library that checks for internet
  internet_connection_checker: ^1.0.0+1
  # A flutter plugin for adapting screen and font size.Guaranteed to look good on different models
  flutter_screenutil: ^5.9.0
  # Updating app's launcher icon.
  flutter_launcher_icons: ^0.13.1
  # Animations built with the Rive editor
  rive: ^0.12.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Automatically generate navigation
  auto_route_generator:
  # Code generation and modular compilation
  build_runner:
  # Recommended lints to encourage good coding practices
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/rive/

  fonts:
    - family: inter
      fonts:
        - asset: assets/fonts/inter/inter-Light.ttf
          weight: 300
        - asset: assets/fonts/inter/inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/inter-Bold.ttf
          weight: 700

flutter_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"

flutter_assets:
  assets_path: assets/
  output_path: lib/src/core/utils/
  filename: app_assets.dart
  field_prefix: null
