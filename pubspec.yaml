name: icare
description: "A new Flutter project."
publish_to: "none"
version: 1.0.3+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  cloud_firestore: ^4.15.5
  firebase_auth: ^4.17.5
  firebase_core: ^2.25.4
  # Flutter plugin for Google Sign-In, a secure authentication system for signing in with a Google account.
  google_sign_in: ^6.2.1
  # A declarative routing solution for navigation
  auto_route: ^7.9.2
  # Code generator (mainly used with Cubit & retrofit)
  freezed: ^2.4.7
  freezed_annotation: ^2.4.1
  # Automatically generate code for converting to and from JSON by annotating Dart classes.
  json_serializable: ^6.7.1
  json_annotation: ^4.8.1
  # Simple direct Service Locator that allows to access the concrete implementation from everywhere
  get_it: ^7.6.7
  # State management
  flutter_bloc: ^8.1.4
  # Networking
  dio: ^5.4.1
  retrofit: ^4.1.0
  pretty_dio_logger: ^1.3.1
  # An SVG rendering and widget library for Flutter, which allows painting
  flutter_svg: ^2.0.10+1
  # Flutter plugin for reading and writing simple key-value pairs for cache
  shared_preferences: ^2.2.2
  # Dart library that checks for internet
  internet_connection_checker: ^1.0.0+1
  # A flutter plugin for adapting screen and font size.Guaranteed to look good on different models
  flutter_screenutil: ^5.9.0
  # Updating app's launcher icon.
  flutter_launcher_icons: ^0.13.1
  # Animations built with the Rive editor
  rive: ^0.13.1
  # Approximate how Flutter app looks and performs on another device.
  device_preview: ^1.1.0
  # A PageView widget adjusting it's height to currently displayed page
  expandable_page_view: ^1.0.17
  # For splash screen
  flutter_native_splash: ^2.3.10
  # Flutter library to load and cache network images. Can also be used with placeholder and error widgets.
  cached_network_image: ^3.3.1
  # Beautiful animations inspired on Animate.css, every animation is a customizable widget.
  animate_do: ^3.3.4
  # To add staggered animations to your ListView, GridView
  flutter_staggered_animations: ^1.1.1
  # A flutter plugin for displaying a countdown timer
  flutter_countdown_timer: ^4.1.0
  # Audio recorder from microphone to file or stream 
  record: ^5.0.4
  # Flutter plugin for getting commonly used locations on host platform file systems, such as the temp and app data directories.
  path_provider: ^2.1.2
  # Permission plugin for Flutter. This plugin provides a cross-platform (iOS, Android) API to request and check permissions.
  permission_handler: ^11.3.0
  # Provides simple yet beautiful skeleton loaders
  shimmer: ^3.0.0
  # The Google AI Dart SDK enables developers to use Google's state-of-the-art generative AI models (like Gemini).
  google_generative_ai: ^0.2.2
  # Easily configure any flutter application with global variables using a `.env` file.
  flutter_dotenv: ^5.1.0
  # A flutter package project which contains a collection of cool and beautiful text animations.
  animated_text_kit: ^4.2.2
  # Create diverse designs of chat bubbles
  flutter_chat_bubble: ^2.0.2
  # 
  intl: ^0.18.1




dev_dependencies:
  flutter_test:
    sdk: flutter

  retrofit_generator: ^8.1.0
  # Automatically generate navigation
  auto_route_generator:
  # A build system for Dart code generation and modular compilation.
  build_runner: ^2.4.8
  # Recommended lints to encourage good coding practices
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/rive/
    - assets/icons/
    - assets/svgs/
    - .env

  fonts:
    - family: inter
      fonts:
        - asset: assets/fonts/inter/inter-Light.ttf
          weight: 300
        - asset: assets/fonts/inter/inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/inter-Bold.ttf
          weight: 700

flutter_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"

flutter_assets:
  assets_path: assets/
  output_path: lib/src/core/utils/
  filename: app_assets.dart
  field_prefix: null
