name: icare
description: "A child care app."
publish_to: "none"
version: 1.2.5+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  cloud_firestore: ^4.15.10
  firebase_auth: ^4.18.0
  firebase_core: ^2.27.2
  firebase_storage: ^11.6.11
  firebase_messaging: ^14.9.1
  # Flutter plugin for Google Sign-In, a secure authentication system for signing in with a Google account.
  google_sign_in: ^6.2.1
  # A declarative routing solution for navigation
  auto_route: ^8.0.0
  # Simple direct Service Locator that allows to access the concrete implementation from everywhere
  get_it: ^7.6.7
  # State management
  flutter_bloc: ^8.1.5
  # Networking
  dio: ^5.4.2+1
  retrofit: ^4.1.0
  # Dio interceptor that logs network calls in a pretty, easy to read format.
  pretty_dio_logger: ^1.3.1
  # Code generator (mainly used with Cubit & retrofit)
  freezed_annotation: ^2.4.1
  # Classes and helper functions that support JSON code generation via the `json_serializable` package.
  json_annotation: ^4.9.0
  # An SVG rendering and widget library for Flutter, which allows painting
  flutter_svg: ^2.0.10+1
  # Flutter plugin for reading and writing simple key-value pairs for cache
  shared_preferences: ^2.2.2
  # Dart library that checks for internet
  internet_connection_checker: ^1.0.0+1
  # A flutter plugin for adapting screen and font size.Guaranteed to look good on different models
  flutter_screenutil: ^5.9.0
  # Animations built with the Rive editor
  rive: ^0.13.1
  # A PageView widget adjusting it's height to currently displayed page
  expandable_page_view: ^1.0.17
  # For splash screen
  flutter_native_splash: ^2.3.10
  # Flutter library to load and cache network images. Can also be used with placeholder and error widgets.
  cached_network_image: ^3.3.1
  # Beautiful animations inspired on Animate.css, every animation is a customizable widget.
  animate_do: ^3.3.4
  # A flutter plugin for displaying a countdown timer
  flutter_countdown_timer: ^4.1.0
  # Audio recorder from microphone to file or stream 
  record: ^5.0.5
  # Flutter plugin for getting commonly used locations on host platform file systems, such as the temp and app data directories.
  path_provider: ^2.1.2
  # Provides simple yet beautiful skeleton loaders
  shimmer: ^3.0.0
  # The Google AI Dart SDK enables developers to use Google's state-of-the-art generative AI models (like Gemini).
  google_generative_ai: ^0.2.2
  # Easily configure any flutter application with global variables using a `.env` file.
  flutter_dotenv: ^5.1.0
  # Create diverse designs of chat bubbles
  flutter_chat_bubble: ^2.0.2
  # To deal with dates, times and others
  intl: ^0.18.0
  # Flutter plugin for selecting images from the Android and iOS image library, and taking new pictures with the camera.
  image_picker: ^1.0.7
  # A Markdown renderer for Flutter
  flutter_markdown: ^0.6.22
  # Low-level link (text, URLs, emails, phone numbers, user tags) parsing library in Dart.
  flutter_linkify: ^6.0.0
  # Flutter plugin for launching a URL. Supports web, phone, SMS, and email schemes.
  url_launcher: ^6.2.5
  # Build custom carousel slider with infinite scrolling and multiple items
  carousel_slider: ^4.2.1
  # A Flutter plugin to play multiple audio files simultaneously
  audioplayers: ^6.0.0
  # A highly customizable bar graph(or wave graph) with animation, color, radius, spaces, etc.
  audio_wave: ^0.1.5
  # Library that allows you to display progress widgets based on percentage
  percent_indicator: ^4.2.3
  # A cross platform plugin for displaying and scheduling local notifications for Flutter applications
  flutter_local_notifications: ^17.1.2
  # Provides API to request and check permissions on Android and iOS.
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Updating app's launcher icon.
  flutter_launcher_icons: ^0.13.1
  # Code generator (mainly used with Cubit & retrofit)
  retrofit_generator: ^8.1.0
  # Automatically generate navigation
  auto_route_generator: ^8.0.0
  # A build system for Dart code generation and modular compilation.
  build_runner: ^2.4.8
  # Recommended lints to encourage good coding practices
  flutter_lints: ^3.0.2
  # Code generator (mainly used with Cubit & retrofit)
  freezed: ^2.5.2
  # Automatically generate code for converting to and from JSON by annotating Dart classes.
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/rive/
    - assets/svgs/
    - .env
  fonts:
    - family: inter
      fonts:
        - asset: assets/fonts/inter/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
    - family: lateef
      fonts:
        - asset: assets/fonts/lateef/Lateef-Regular.ttf
          weight: 400
    - family: readex-pro
      fonts:
        - asset: assets/fonts/readex-pro/ReadexPro-Regular.ttf
          weight: 400

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"

flutter_assets:
  assets_path: assets/
  output_path: lib/src/core/utils/
  filename: app_assets.dart
  field_prefix: null
